<style>
:root{--red:#f43f5e;--red2:#e11d48}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%}
body{background:#09090b;color:#f4f4f5;overflow-x:hidden;position:relative;width:100%;max-width:100vw}

/* ============ AURORA + NỀN (copy từ web mẹ) ============ */
.aurora{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;contain:strict;max-width:100vw}
.aurora span{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.28;mix-blend-mode:screen;
  background:radial-gradient(circle,currentColor,transparent 68%);
  will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
.aurora .a1{color:#f43f5e;top:-15%;left:-15%;animation:float1 26s ease-in-out infinite}
.aurora .a2{color:#8b5cf6;top:15%;right:-18%;animation:float2 30s ease-in-out infinite}
.aurora .a3{color:#06b6d4;bottom:-20%;left:25%;animation:float3 34s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(6vw,4vh,0)}}
@keyframes float2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-5vw,6vh,0)}}
@keyframes float3{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(4vw,-5vh,0)}}

.spotlight{position:fixed;top:0;left:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(244,63,94,.10),transparent 60%);
  will-change:transform;transform:translate3d(0,0,0);opacity:0;transition:opacity .4s}
@media(hover:hover) and (pointer:fine){.spotlight{opacity:1}}

.grid-bg{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 15%,#000,transparent);
  mask-image:radial-gradient(ellipse 70% 55% at 50% 15%,#000,transparent)}

/* ============ LIQUID GLASS CARD ============ */
.card{
  position:relative;border-radius:1.25rem;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 20px 40px -22px rgba(0,0,0,.7);
  transition:border-color .3s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
  overflow:hidden;contain:paint;
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.10),transparent 45%),
    radial-gradient(120% 80% at 100% 100%,rgba(244,63,94,.10),transparent 45%);
  opacity:.9;
}
.card:hover{
  border-color:rgba(244,63,94,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 48px -22px rgba(244,63,94,.45);
}

/* ============ LIQUID GLASS PRODUCT (đặc trưng) ============ */
.glass-card{
  position:relative;border-radius:1.25rem;
  background:
    linear-gradient(135deg,
      rgba(255,255,255,.10) 0%,
      rgba(255,255,255,.03) 45%,
      rgba(255,255,255,.07) 100%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(255,255,255,.05),
    0 20px 44px -22px rgba(0,0,0,.75);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  overflow:hidden;contain:paint;
}
/* vệt sáng xoay chậm tạo cảm giác "thuỷ tinh lỏng" */
.glass-card::before{
  content:"";position:absolute;inset:-60%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg,
    transparent 0deg,
    rgba(255,255,255,.10) 40deg,
    rgba(244,63,94,.14) 90deg,
    transparent 140deg,
    transparent 360deg);
  animation:liquid 14s linear infinite;
  opacity:.55;
}
/* lớp highlight cố định ở góc trên - giả lập ánh sáng phản chiếu */
.glass-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:
    radial-gradient(140% 70% at 0% 0%,rgba(255,255,255,.16),transparent 55%),
    radial-gradient(140% 70% at 100% 100%,rgba(139,92,246,.10),transparent 55%);
}
.glass-card > *{position:relative;z-index:1}
.glass-card:hover{
  transform:translateY(-3px);
  border-color:rgba(244,63,94,.55);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 26px 52px -22px rgba(244,63,94,.5);
}
@keyframes liquid{to{transform:rotate(360deg)}}

/* ============ BUTTON (copy web mẹ) ============ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;border-radius:.8rem;cursor:pointer;overflow:hidden;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),filter .2s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn-red{color:#fff;background:linear-gradient(180deg,#ff5c7a,#e11d48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px -8px rgba(244,63,94,.85)}
.btn-red:hover{filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 34px -8px rgba(244,63,94,1)}
.btn-dark{color:#f4f4f5;background:rgba(24,24,27,.7);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-dark:hover{background:rgba(35,35,39,.85);border-color:rgba(244,63,94,.4)}
.btn-shine::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transition:left .6s}
.btn-shine:hover::after{left:100%}
.btn[disabled]{cursor:not-allowed}

.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* ============ TAB (glass style) ============ */
.tab-btn{
  white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:.5rem;
  padding:.75rem .5rem;border-radius:1rem;border:1px solid transparent;transition:.25s cubic-bezier(.2,.8,.2,1);
  color:#a1a1aa;background:transparent;
}
.tab-btn:hover{color:#f4f4f5;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.tab-btn.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(244,63,94,.18),rgba(139,92,246,.10));
  border-color:rgba(244,63,94,.45);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  backdrop-filter:blur(16px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.20),
    0 10px 30px -10px rgba(244,63,94,.55);
}
.tab-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:.25s;overflow:hidden}
.tab-icon svg,.tab-icon i{width:26px;height:26px;font-size:22px}
.tab-btn.active .tab-icon{
  background:linear-gradient(180deg,#ff5c7a,#e11d48);
  border-color:transparent;
  box-shadow:0 8px 20px -6px rgba(244,63,94,.6);
}
.tab-btn.active .tab-icon svg *{fill:#fff}

.tabs-scroll{overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}

.stock-line{font-size:.72rem;color:#71717a}
.fade-swap{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ LOGO ============ */
.product-logo{
  width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);flex-shrink:0;overflow:hidden;
}
.product-logo svg{width:34px;height:34px}
.glass-card:hover .product-logo{transform:scale(1.06)}

/* ============ JS REVEAL ============ */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.js .rv.in{opacity:1;transform:none}

/* ============ REDUCED MOTION ============ */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .aurora span,.glass-card::before{animation:none!important}
  .js .rv{opacity:1;transform:none;transition:none}
  .spotlight{display:none}
}
</style>
</head>

/* ============ RENDER ============ */
const tabsEl = document.getElementById("categoryTabs");

function renderTabs(){
  tabsEl.innerHTML = CATEGORIES.map(c => `
    <button class="tab-btn ${c.id===activeCat ? "active":""}" data-cat="${c.id}">

  `).join("");
  tabsEl.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { activeCat = btn.dataset.cat; renderTabs(); renderGrid(); };

}

function renderGrid(){
  const list = activeCat === "all" ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);

/* ============ HIỆU ỨNG (copy từ web mẹ) ============ */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Reveal on scroll
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return;
  e.target.classList.add("in"); io.unobserve(e.target);
}), {threshold:.12});
document.querySelectorAll(".rv").forEach(el => io.observe(el));

// Spotlight — tự ngủ khi đứng yên (giống web mẹ)
if (matchMedia("(hover:hover) and (pointer:fine)").matches && !reduce){
  const sp = document.getElementById("spotlight");
  let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my, raf = null, idle = 0;
  addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; idle = 0; if (!raf) raf = requestAnimationFrame(tick); }, {passive:true});
  function tick(){
    cx += (mx-cx) * 0.14; cy += (my-cy) * 0.14;
    sp.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
    idle++;
    if (idle > 60 && Math.abs(mx-cx) < .5 && Math.abs(my-cy) < .5){ raf = null; return; }
    raf = requestAnimationFrame(tick);
  }
}

// Ripple
document.addEventListener("click", e => {
  const el = e.target.closest(".btn, .glass-card, .tab-btn");
  if (!el || reduce) return;
  const r = el.getBoundingClientRect();
  const s = Math.max(r.width, r.height);
  const rip = document.createElement("span");
  rip.className = "ripple";
  rip.style.width = rip.style.height = s+"px";
  rip.style.left = (e.clientX - r.left - s/2)+"px";
  rip.style.top  = (e.clientY - r.top  - s/2)+"px";
  if (getComputedStyle(el).position === "static") el.style.position = "relative";
  el.appendChild(rip);
  setTimeout(()=>rip.remove(), 650);
});
</script>
